[project]
name = "mlweather"
version = "0.1.3"
description = "A package to collect and prepare weather data for ml jobs - based on the Open-Meteo weather source"
readme = "README.md"
authors = [
    { name = "Julien Gooris", email = "jgooris@kap.bzh" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.30.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "requests>=2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "python-dotenv>=1.1.0",
]
